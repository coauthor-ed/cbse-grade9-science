<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <!-- Original artwork for L02 s03: food / fan / car as three energy stores. No text by design. -->
  <rect width="1500" height="500" fill="#faf9f5"/>
  <g stroke="#3a332b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

  <!-- ===== Panel 1: person walking away from a meal ===== -->
  <g>
    <rect x="12" y="12" width="476" height="476" rx="28" fill="#f1ece0"/>
    <path d="M14,420 L486,420 L486,460 Q486,486 460,486 L40,486 Q14,486 14,460 Z" fill="#e2d6bf" stroke="none"/>
    <line x1="14" y1="420" x2="486" y2="420"/>
    <!-- small table with plate -->
    <g>
      <line x1="58" y1="318" x2="58" y2="420"/>
      <line x1="152" y1="318" x2="152" y2="420"/>
      <rect x="40" y="306" width="130" height="16" rx="5" fill="#9a6a45"/>
      <ellipse cx="105" cy="300" rx="46" ry="9" fill="#ffffff"/>
      <path d="M75,298 Q88,272 108,276 Q124,272 132,298 Z" fill="#f6f1e2"/>
      <path d="M112,292 Q120,280 132,286 Q136,294 132,298 L114,298 Z" fill="#d9a441"/>
    </g>
    <!-- motion lines -->
    <g stroke-width="5" opacity="0.55">
      <line x1="196" y1="215" x2="226" y2="215"/>
      <line x1="186" y1="250" x2="222" y2="250"/>
      <line x1="196" y1="285" x2="226" y2="285"/>
    </g>
    <!-- back arm (forward swing) -->
    <path d="M322,205 L348,248 L358,282" fill="none" stroke-width="30"/>
    <path d="M322,205 L348,248 L358,282" fill="none" stroke="#c98b5e" stroke-width="20"/>
    <path d="M322,205 L340,236" fill="none" stroke="#e0a43c" stroke-width="20"/>
    <!-- back leg -->
    <path d="M292,292 L268,348 L246,402" fill="none" stroke-width="34"/>
    <path d="M292,292 L268,348 L246,402" fill="none" stroke="#4f6a8a" stroke-width="25"/>
    <path d="M226,404 Q228,394 246,396 L262,400 Q268,412 258,416 L232,416 Q224,414 226,404 Z" fill="#5b4433"/>
    <!-- front leg -->
    <path d="M308,292 L334,346 L344,402" fill="none" stroke-width="34"/>
    <path d="M308,292 L334,346 L344,402" fill="none" stroke="#4f6a8a" stroke-width="25"/>
    <path d="M334,400 L356,398 Q376,402 376,412 Q374,417 366,417 L334,417 Q328,408 334,400 Z" fill="#5b4433"/>
    <!-- torso (a little heavy) -->
    <path d="M262,212 Q264,186 300,182 Q338,186 342,214 L348,290 Q348,304 330,304 L270,304 Q252,304 254,290 Z" fill="#e0a43c"/>
    <path d="M286,184 L300,202 L314,184" fill="none" stroke-width="4"/>
    <!-- neck + head -->
    <rect x="292" y="160" width="18" height="26" rx="6" fill="#c98b5e"/>
    <circle cx="304" cy="132" r="36" fill="#c98b5e"/>
    <path d="M270,128 Q266,94 302,92 Q334,92 340,118 Q322,110 306,116 Q294,104 286,120 Q282,132 278,140 Z" fill="#2f2722"/>
    <circle cx="324" cy="132" r="4" fill="#3a332b" stroke="none"/>
    <path d="M318,150 Q326,154 332,148" fill="none" stroke-width="4"/>
    <path d="M284,132 Q276,138 284,146" fill="#c98b5e" stroke-width="4"/>
    <!-- front arm (back swing) -->
    <path d="M282,205 L256,246 L246,280" fill="none" stroke-width="30"/>
    <path d="M282,205 L256,246 L246,280" fill="none" stroke="#c98b5e" stroke-width="20"/>
    <path d="M282,205 L264,234" fill="none" stroke="#e0a43c" stroke-width="20"/>
  </g>

  <!-- ===== Panel 2: ceiling fan turning ===== -->
  <g transform="translate(500,0)">
    <rect x="12" y="12" width="476" height="476" rx="28" fill="#f1ece0"/>
    <path d="M14,40 Q14,14 40,14 L460,14 Q486,14 486,40 L486,72 L14,72 Z" fill="#e3dccd"/>
    <path d="M14,420 L486,420 L486,460 Q486,486 460,486 L40,486 Q14,486 14,460 Z" fill="#e2d6bf" stroke="none"/>
    <line x1="14" y1="420" x2="486" y2="420"/>
    <!-- quiet room hint: window -->
    <g>
      <rect x="330" y="300" width="100" height="76" rx="6" fill="#dfe9f3"/>
      <line x1="380" y1="300" x2="380" y2="376" stroke-width="4"/>
      <line x1="330" y1="338" x2="430" y2="338" stroke-width="4"/>
      <rect x="320" y="374" width="120" height="10" rx="3" fill="#9a6a45"/>
    </g>
    <!-- canopy + downrod -->
    <path d="M226,72 L274,72 L266,92 L234,92 Z" fill="#8a96a6"/>
    <rect x="243" y="92" width="14" height="84" fill="#8a96a6"/>
    <!-- motion blur ghosts and swirl (ellipse plane) -->
    <g transform="translate(250,214) scale(1.12,0.44)" stroke="none">
      <g fill="#4f6a8a" opacity="0.12">
        <path d="M40,-20 L190,-26 Q214,0 190,26 L40,20 Z" transform="rotate(-6)"/>
        <path d="M40,-20 L190,-26 Q214,0 190,26 L40,20 Z" transform="rotate(114)"/>
        <path d="M40,-20 L190,-26 Q214,0 190,26 L40,20 Z" transform="rotate(234)"/>
      </g>
      <g fill="#4f6a8a" opacity="0.07">
        <path d="M40,-20 L190,-26 Q214,0 190,26 L40,20 Z" transform="rotate(-30)"/>
        <path d="M40,-20 L190,-26 Q214,0 190,26 L40,20 Z" transform="rotate(90)"/>
        <path d="M40,-20 L190,-26 Q214,0 190,26 L40,20 Z" transform="rotate(210)"/>
      </g>
    </g>
    <g fill="none" stroke-width="5" opacity="0.5">
      <path d="M30,236 A240,104 0 0 0 140,312"/>
      <path d="M470,192 A240,104 0 0 0 360,116"/>
    </g>
    <!-- blades -->
    <g transform="translate(250,214) scale(1.12,0.44)">
      <path d="M40,-20 L190,-26 Q214,0 190,26 L40,20 Z" fill="#9a6a45" vector-effect="non-scaling-stroke" transform="rotate(18)"/>
      <path d="M40,-20 L190,-26 Q214,0 190,26 L40,20 Z" fill="#9a6a45" vector-effect="non-scaling-stroke" transform="rotate(138)"/>
      <path d="M40,-20 L190,-26 Q214,0 190,26 L40,20 Z" fill="#9a6a45" vector-effect="non-scaling-stroke" transform="rotate(258)"/>
    </g>
    <!-- motor housing seen from below -->
    <path d="M206,188 Q210,170 250,170 Q290,170 294,188 L298,216 L202,216 Z" fill="#8a96a6"/>
    <ellipse cx="250" cy="218" rx="52" ry="19" fill="#a9b3c0"/>
    <ellipse cx="250" cy="222" rx="16" ry="6" fill="#e0a43c" stroke-width="4"/>
  </g>

  <!-- ===== Panel 3: blue car driving ===== -->
  <g transform="translate(1000,0)">
    <rect x="12" y="12" width="476" height="476" rx="28" fill="#f1ece0"/>
    <path d="M14,400 L486,400 L486,460 Q486,486 460,486 L40,486 Q14,486 14,460 Z" fill="#7d7a73" stroke="none"/>
    <line x1="14" y1="400" x2="486" y2="400"/>
    <g stroke="#f1ece0" stroke-width="7" stroke-linecap="butt">
      <line x1="30" y1="446" x2="90" y2="446"/>
      <line x1="140" y1="446" x2="200" y2="446"/>
      <line x1="250" y1="446" x2="310" y2="446"/>
      <line x1="360" y1="446" x2="420" y2="446"/>
    </g>
    <!-- fuel pump on the kerb, small -->
    <g>
      <rect x="418" y="318" width="44" height="82" rx="6" fill="#e0a43c"/>
      <rect x="426" y="328" width="28" height="20" rx="3" fill="#f6f1e2" stroke-width="4"/>
      <path d="M462,340 Q476,344 474,362 L474,384" fill="none" stroke-width="5"/>
      <rect x="412" y="394" width="56" height="8" rx="2" fill="#5b4433"/>
    </g>
    <!-- speed lines -->
    <g stroke-width="5" opacity="0.55">
      <line x1="26" y1="300" x2="56" y2="300"/>
      <line x1="20" y1="334" x2="56" y2="334"/>
      <line x1="26" y1="368" x2="56" y2="368"/>
    </g>
    <!-- car body, hatchback facing right -->
    <g transform="translate(-28,0)">
      <path d="M95,382 L92,322 Q95,300 115,292 L150,250 Q158,240 172,240 L282,240 Q295,240 305,250 L345,296 L392,308 Q408,314 408,334 L408,370 Q408,382 396,382 L382,382 A42,42 0 0 0 298,382 L202,382 A42,42 0 0 0 118,382 Z" fill="#3f78c4"/>
      <path d="M126,292 L158,255 L224,255 L224,292 Z" fill="#dfe9f3"/>
      <path d="M236,292 L236,255 L284,255 Q292,255 298,262 L326,292 Z" fill="#dfe9f3"/>
      <line x1="230" y1="300" x2="230" y2="372" stroke-width="4"/>
      <line x1="248" y1="314" x2="266" y2="314" stroke-width="5"/>
      <rect x="390" y="320" width="16" height="12" rx="3" fill="#f2d27a" stroke-width="4"/>
      <rect x="92" y="326" width="10" height="16" rx="3" fill="#c0563a" stroke-width="4"/>
      <!-- wheels -->
      <g>
        <circle cx="160" cy="385" r="32" fill="#3a332b"/>
        <circle cx="160" cy="385" r="15" fill="#c9cdd3" stroke-width="4"/>
        <path d="M160,374 L160,396 M150,379 L170,391 M150,391 L170,379" stroke-width="3"/>
      </g>
      <g>
        <circle cx="340" cy="385" r="32" fill="#3a332b"/>
        <circle cx="340" cy="385" r="15" fill="#c9cdd3" stroke-width="4"/>
        <path d="M340,374 L340,396 M330,379 L350,391 M330,391 L350,379" stroke-width="3"/>
      </g>
    </g>
  </g>
  </g>
</svg>

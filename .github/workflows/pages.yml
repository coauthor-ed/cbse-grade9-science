# Check only. The site itself is published by GitHub Pages from the main branch
# (Settings > Pages > Deploy from a branch), so this workflow never deploys.
# It validates every course bundle with the engine's own tools/validation
# (checked out into _engine/), because bundles may reference engine-root files
# such as /src/simulations/biology/*.js that only exist in the engine repo.
name: check
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: coauthor-ed/coauthor
          path: _engine
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Bundle integrity on every bundle
        run: |
          set -e
          dirs=$(find . -mindepth 2 -maxdepth 3 -name manifest.json -not -path './_engine/*' -not -path './tools/*' -not -path './.github/*' -printf '%h\n' | sort)
          node _engine/tools/validation/bundle-integrity.mjs $dirs
